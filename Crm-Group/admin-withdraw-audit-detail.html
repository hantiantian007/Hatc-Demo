        function toggleSubmenu(button) {
            const submenu = button.nextElementSibling;
            const arrow = button.querySelector('.fa-chevron-right');
            submenu.classList.toggle('submenu-expanded');
            if (arrow) arrow.classList.toggle('arrow-rotated');
        }

        function getPageData() {
            const params = new URLSearchParams(window.location.search);
            const account = params.get('account');
            return detailData[account] || detailData['9900456'];
        }

        function renderDetailSection(data) {
            const detailGrid = document.getElementById('detailGrid');
            detailGrid.innerHTML = data.detailItems.map((item) => `
                <div>
                    <div class="detail-item-label ${item.highlight ? 'change-highlight' : ''}">${item.label}</div>
                    <div class="detail-item-value ${item.highlight ? 'change-highlight' : ''}">${item.value}</div>
                </div>
            `).join('');

            const fundGrid = document.getElementById('fundGrid');
            fundGrid.innerHTML = data.fundItems.map((item) => `
                <div>
                    <div class="fund-label ${item.highlight ? 'change-highlight' : ''}">${item.label}</div>
                    <div class="fund-value ${item.highlight ? 'change-highlight' : ''}">${item.value}</div>
                </div>
            `).join('');
        }

        function renderRecords(data) {
            const tbody = document.getElementById('recordBody');
            tbody.innerHTML = data.records.map((row) => `
                <tr class="hover:bg-gray-50/60">
                    <td class="px-5 py-4 whitespace-nowrap text-gray-600">${row.orderNo}</td>
                    <td class="px-5 py-4 whitespace-nowrap text-gray-700">${row.mt}</td>
                    <td class="px-5 py-4 whitespace-nowrap ${row.highlight ? 'change-highlight font-medium' : 'text-gray-700'}">${row.amount}</td>
                    <td class="px-5 py-4 whitespace-nowrap text-gray-500">${row.method}</td>
                    <td class="px-5 py-4 whitespace-nowrap text-gray-500">${row.audit}</td>
                    <td class="px-5 py-4 whitespace-nowrap text-gray-500">${row.pay}</td>
                    <td class="px-5 py-4 whitespace-nowrap text-gray-500">${row.apply}</td>
                    <td class="px-5 py-4 whitespace-nowrap text-gray-500">${row.done}</td>
                </tr>
            `).join('');
        }

        function renderPayments(data) {
            const tbody = document.getElementById('paymentBody');
            tbody.innerHTML = data.payments.map((row) => `
                <tr class="hover:bg-gray-50/60">
                    <td class="px-5 py-4 whitespace-nowrap text-gray-500 ${row.highlight ? 'change-highlight' : ''}">${row.method}</td>
                    <td class="px-5 py-4 whitespace-nowrap text-gray-500">${row.no}</td>
                    <td class="px-5 py-4 whitespace-nowrap text-gray-500">${row.time}</td>
                    <td class="px-5 py-4 whitespace-nowrap ${row.status === '支付成功' ? 'text-emerald-600' : 'text-gray-500'}">
                        <span class="inline-flex items-center gap-1">
                            <span class="w-2 h-2 rounded-full ${row.status === '支付成功' ? 'bg-emerald-500' : 'bg-gray-300'}"></span>
                            <span>${row.status}</span>
                        </span>
                    </td>
                    <td class="px-5 py-4 whitespace-nowrap text-gray-700 ${row.highlight ? 'change-highlight font-medium' : ''}">${row.actual}</td>
                    <td class="px-5 py-4 whitespace-nowrap text-gray-700 ${row.highlight ? 'change-highlight font-medium' : ''}">${row.amount}</td>
                    <td class="px-5 py-4 whitespace-nowrap text-gray-500">${row.operator}</td>
                    <td class="px-5 py-4 whitespace-nowrap text-gray-500">${row.reason}</td>
                    <td class="px-5 py-4 whitespace-nowrap text-gray-400">${row.action}</td>
                </tr>
            `).join('');
        }

        function renderTimeline(data) {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = data.timeline.map((item) => `
                <div class="timeline-item">
                    <span class="timeline-dot ${item.status === 'done' ? 'done' : ''}"></span>
                    <div class="text-sm font-semibold text-gray-700 flex items-center gap-2">
                        <span>${item.title}</span>
                        ${item.status === 'done' ? '<span class="text-[10px] px-2 py-0.5 rounded bg-emerald-50 text-emerald-600">通过</span>' : ''}
                    </div>
                    <div class="mt-1 text-xs text-gray-400">${item.time}</div>
                    ${item.user ? `
                        <div class="mt-3 rounded-lg bg-gray-50 border border-gray-100 p-3 text-xs text-gray-500 space-y-1">
                            <div>审核人：${item.user}</div>
                            <div>审核时效：${item.duration}</div>
                            <div>审核意见：${item.result}</div>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        const pageData = getPageData();
        renderDetailSection(pageData);
        renderRecords(pageData);
        renderPayments(pageData);
        renderTimeline(pageData);
