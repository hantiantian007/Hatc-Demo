    <script>
        // 左侧菜单手风琴交互逻辑
        document.addEventListener('DOMContentLoaded', function() {
            const menuParents = document.querySelectorAll('.flex.flex-col > a.flex.items-center.justify-between');
            menuParents.forEach(parent => {
                parent.addEventListener('click', function(e) {
                    e.preventDefault();
                    const submenu = this.nextElementSibling;
                    const arrow = this.querySelector('.fa-angle-down, .fa-angle-right');
                    
                    if (submenu && submenu.classList.contains('flex-col')) {
                        if (submenu.classList.contains('hidden')) {
                            submenu.classList.remove('hidden');
                            submenu.classList.add('flex');
                            if(arrow) {
                                arrow.classList.remove('fa-angle-right');
                                arrow.classList.add('fa-angle-down');
                            }
                        } else {
                            submenu.classList.add('hidden');
                            submenu.classList.remove('flex');
                            if(arrow) {
                                arrow.classList.remove('fa-angle-down');
                                arrow.classList.add('fa-angle-right');
                            }
                        }
                    }
                });
            });
        });
    </script>

    <!-- 演示控制脚本 -->
    <div class="fixed bottom-4 right-4 bg-white p-4 rounded-lg shadow-xl border border-gray-200 z-50 text-sm">
        <div class="font-bold mb-2 text-gray-800">页面状态演示控制</div>
        <div class="flex gap-2">
            <button onclick="showSuccess()" class="px-3 py-1.5 bg-green-100 text-green-700 hover:bg-green-200 rounded transition-colors">成功状态</button>
            <button onclick="showFail()" class="px-3 py-1.5 bg-red-100 text-red-700 hover:bg-red-200 rounded transition-colors">余额不足状态</button>

    <script>
        function showSuccess() {
            document.getElementById('success-view').classList.remove('hidden');
            document.getElementById('fail-view').classList.add('hidden');
        }
        function showFail() {
            document.getElementById('success-view').classList.add('hidden');
            document.getElementById('fail-view').classList.remove('hidden');
        }
    </script>
