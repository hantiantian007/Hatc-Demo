<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>申请MT账户页面 PRD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
        th, td { border: 1px solid #e5e7eb; padding: 12px 16px; text-align: left; font-size: 14px; vertical-align: top; }
        th { background: #f9fafb; color: #374151; font-weight: 600; }
        td { color: #4b5563; line-height: 1.75; }
        .highlight { color: #C19B5E; font-weight: 600; }
        .module-title { border-left: 4px solid #C19B5E; padding-left: 12px; margin: 28px 0 16px; font-size: 18px; font-weight: 700; color: #1f2937; }
    </style>
</head>
<body class="bg-gray-50 p-8 font-sans">
    <div class="max-w-5xl mx-auto bg-white rounded-lg shadow-sm p-8">
        <div class="flex justify-between items-center border-b pb-4 mb-6">
            <h1 class="text-2xl font-bold text-gray-800">【页面 PRD】申请MT账户</h1>
            <div class="flex gap-3">
                <a href="admin-account-mt-open.html" class="px-4 py-2 rounded bg-[#C19B5E] text-white text-sm">查看原型</a>
                <a href="../index.html" class="px-4 py-2 rounded bg-gray-500 text-white text-sm">返回需求看板</a>
            </div>
        </div>

        <div class="bg-blue-50 border-l-4 border-blue-500 p-4 text-sm text-blue-800">
            本文档描述<span class="highlight">账户管理</span>页面点击<span class="highlight">MT开户</span>按钮后进入的开户申请页原型。
        </div>

        <div class="module-title">1. 新增/调整需求</div>
        <table>
            <thead>
                <tr><th width="24%">需求项</th><th>说明</th></tr>
            </thead>
            <tbody>
                <tr><td class="font-medium">账户类型选择</td><td>在账号类型上方新增 <span class="highlight">账户类型</span> 下拉框，支持选择 <span class="highlight">标准账户</span>、<span class="highlight">美分账户</span>。</td></tr>
            </tbody>
        </table>

        <div class="module-title">2. 测试重点</div>
        <table>
            <tbody>
                <tr><td>1. 页面内是否已展示账户类型选择字段，且选项仅包含标准账户、美分账户。</td></tr>
                <tr><td>2. 账户类型选择字段是否展示在账号类型上方。</td></tr>
                <tr><td>3. 切换不同账户类型时，页面展示是否正常，无异常文案或错位。</td></tr>
            </tbody>
        </table>
    </div>
</body>
</html>
