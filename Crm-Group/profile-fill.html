    <script>
        function toggleSubmenu(button) {
            const submenu = button.nextElementSibling;
            const arrow = button.querySelector('.arrow-transition');
            if (!submenu) return;
            submenu.classList.toggle('submenu-expanded');
            if (arrow) arrow.classList.toggle('arrow-rotated');
        }

        const prdModal = document.getElementById('prdModal');
        const prdModalContent = document.getElementById('prdModalContent');
        const prdIframe = document.getElementById('prdIframe');

        function openPrdModal() {
            if (prdIframe) prdIframe.src = 'prd-overseas-id-check.html?t=' + new Date().getTime();
            if (prdModal) prdModal.classList.remove('hidden');
            setTimeout(() => {
                if (prdModalContent) {
                    prdModalContent.classList.remove('translate-x-full');
                    prdModalContent.classList.add('translate-x-0');
                }
            }, 10);
        }

        function closePrdModal() {
            if (prdModalContent) {
                prdModalContent.classList.remove('translate-x-0');
                prdModalContent.classList.add('translate-x-full');
            }
            setTimeout(() => {
                if (prdModal) prdModal.classList.add('hidden');
            }, 300);
        }

        function normalizeHkid(value) {
            return (value || '').toUpperCase().replace(/\s+/g, '').replace(/[()]/g, '');
        }

        function getCharValue(char) {
            if (/^\d$/.test(char)) return Number(char);
            return char.charCodeAt(0) - 55;
        }

        function isValidHkid(value) {
            const normalized = normalizeHkid(value);
            if (!/^[A-Z]{1,2}\d{6}[0-9A]$/.test(normalized)) return false;

            const checkChar = normalized.slice(-1);
            const prefixAndDigits = normalized.slice(0, -1);
            const prefix = prefixAndDigits.slice(0, -6);
            const digits = prefixAndDigits.slice(-6).split('').map(Number);

            let values = [];
            if (prefix.length === 1) {
                values.push(36);
                values.push(getCharValue(prefix[0]));
            } else {
                values.push(getCharValue(prefix[0]));
                values.push(getCharValue(prefix[1]));
            }

            values = values.concat(digits);
            const weights = [9, 8, 7, 6, 5, 4, 3, 2];
            let sum = 0;
            for (let i = 0; i < weights.length; i += 1) {
                sum += values[i] * weights[i];
            }

            const check = (11 - (sum % 11)) % 11;
            const expected = check === 10 ? 'A' : String(check);
            return checkChar === expected;
        }

        function updateHkidValidation() {
            const certType = document.getElementById('certType').value;
            const certNo = document.getElementById('certNo').value;
            const hint = document.getElementById('hkidHint');
            const submitBtn = document.getElementById('submitBtn');
            const activeBtnClass = 'px-4 h-7 rounded bg-brandGold text-white text-[10px] font-medium hover:opacity-90 transition-opacity';
            const defaultHintClass = 'mt-1.5 rounded border px-2.5 py-2 text-[10px] leading-4 bg-dangerBg border-[#F5C2C7] text-dangerText';
            const defaultHintText = '暂时不支持香港身份证开户注册。';

            if (certType !== 'id_card') {
                hint.className = defaultHintClass;
                hint.innerHTML = defaultHintText;
                submitBtn.disabled = false;
                submitBtn.className = activeBtnClass;
                return;
            }

            if (!certNo.trim()) {
                hint.className = defaultHintClass;
                hint.innerHTML = defaultHintText;
                submitBtn.disabled = false;
                submitBtn.className = activeBtnClass;
                return;
            }

            if (isValidHkid(certNo)) {
                hint.className = 'mt-1.5 rounded border px-2.5 py-2 text-[10px] leading-4 bg-dangerBg border-[#F5C2C7] text-dangerText';
                hint.innerHTML = '<div class="font-semibold mb-1">识别结果：香港身份证（HKID）</div>海外版不支持香港身份证开户注册，请使用其他证件或前往港版申请。';
                submitBtn.disabled = true;
                submitBtn.className = 'px-4 h-7 rounded bg-gray-300 text-white text-[10px] font-medium cursor-not-allowed';
                return;
            }

            hint.className = defaultHintClass;
            hint.innerHTML = defaultHintText;
            submitBtn.disabled = false;
            submitBtn.className = activeBtnClass;
        }

        function fillHkidDemo() {
            document.getElementById('certType').value = 'id_card';
            document.getElementById('certNo').value = 'A123456(3)';
            updateHkidValidation();
        }

        function fillPassportDemo() {
            document.getElementById('certType').value = 'passport';
            document.getElementById('certNo').value = 'P1234567';
            updateHkidValidation();
        }

        function clearFormDemo() {
            document.getElementById('certType').value = '';
            document.getElementById('certNo').value = '';
            updateHkidValidation();
        }

        function handleSubmit(event) {
            event.preventDefault();
            updateHkidValidation();
            if (document.getElementById('submitBtn').disabled) return false;
            alert('原型演示：资料提交成功');
            return false;
        }

        updateHkidValidation();
    </script>
