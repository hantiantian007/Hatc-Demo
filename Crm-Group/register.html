<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HATC - 注册</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#1E2126',
                        panelDark: '#2D3036',
                        inputBg: '#3B3E45',
                        brandYellow: '#FCD574',
                        brandYellowHover: '#E5C065',
                        textMuted: '#9CA3AF',
                        errorRed: '#EF4444'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bgDark min-h-screen flex flex-col font-sans relative overflow-hidden text-white">

    <!-- 顶部导航条 -->
    <header class="w-full h-16 flex justify-between items-center px-8 absolute top-0 left-0 z-10">
        <!-- Logo -->
        <div class="text-2xl font-black tracking-wider text-white">HATC</div>
        <!-- 功能按钮与语言切换 -->
        <div class="flex items-center gap-4">
            <!-- PRD相关按钮 -->
            <button onclick="openPrdModal()" class="flex items-center gap-1.5 bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 px-3 py-1.5 rounded transition-colors border border-indigo-500/30 text-xs font-medium">
                <i class="fas fa-file-alt"></i> PRD文档
            </button>
            <a href="../index.html" class="flex items-center gap-1.5 bg-gray-500/20 hover:bg-gray-500/30 text-gray-300 px-3 py-1.5 rounded transition-colors border border-gray-500/30 text-xs font-medium">
                <i class="fas fa-arrow-left"></i> 返回需求看板
            </a>
            <!-- 语言切换 -->
            <div class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition-opacity ml-2">
                <img src="https://flagcdn.com/w20/cn.png" alt="CN" class="w-5 h-auto rounded-sm">
                <span class="text-sm font-medium">简体中文</span>
                <i class="fas fa-chevron-down text-xs ml-1 text-gray-400"></i>
            </div>
        </div>
    </header>

    <!-- 主要内容区 -->
    <main class="flex-1 flex items-center justify-center w-full max-w-7xl mx-auto px-4 gap-20">
        
        <!-- 左侧插画区 (复用登录页) -->
        <div class="hidden lg:flex flex-1 justify-center items-center">
            <div class="relative w-[500px] h-[400px]">
                <svg class="absolute top-10 -left-10 w-[600px] h-[300px] opacity-20" viewBox="0 0 100 50" preserveAspectRatio="none">
                    <path d="M0,25 C20,0 30,50 50,25 C70,0 80,50 100,25" stroke="white" stroke-width="0.5" fill="none"/>
                    <path d="M0,35 C20,10 30,60 50,35 C70,10 80,60 100,35" stroke="white" stroke-width="0.2" fill="none"/>
                </svg>
                <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[350px] h-[280px] bg-gradient-to-br from-yellow-100 to-yellow-600 rounded-xl shadow-2xl rotate-[-15deg] opacity-90 flex items-center justify-center overflow-hidden">
                     <div class="w-[80%] h-[80%] bg-white/20 backdrop-blur-sm rounded-lg border border-white/30 flex flex-col items-center justify-center gap-4">
                         <div class="w-16 h-16 rounded-full bg-white/30 flex items-center justify-center"><i class="fas fa-user text-3xl text-yellow-800"></i></div>
                         <div class="w-3/4 h-3 bg-white/40 rounded-full"></div>
                         <div class="w-1/2 h-3 bg-white/40 rounded-full"></div>
                     </div>
                </div>
                <div class="absolute bottom-10 left-10 w-24 h-24 bg-panelDark rounded-2xl shadow-xl flex items-center justify-center border border-gray-700">
                    <i class="fas fa-chart-bar text-4xl text-brandYellow"></i>
                </div>
                <div class="absolute top-20 right-0 w-32 h-16 bg-gradient-to-r from-orange-300 to-orange-500 rounded-lg shadow-lg rotate-[10deg] opacity-80"></div>
            </div>
        </div>

        <!-- 右侧注册表单区 -->
        <div class="w-full max-w-[420px] bg-panelDark p-10 rounded-2xl shadow-2xl border border-gray-700/50 relative z-10">
            <h2 class="text-2xl font-bold mb-6 text-white">注册 HATC</h2>
            
            <form class="space-y-4">
                <!-- 邮箱 -->
                <div class="space-y-1">
                    <label class="block text-sm font-medium text-gray-300"><span class="text-errorRed mr-1">*</span>邮箱</label>
                    <input type="email" placeholder="请输入您的邮箱" class="w-full bg-inputBg border border-transparent focus:border-brandYellow text-white text-sm rounded-lg px-4 py-3 outline-none transition-colors placeholder-gray-500">
                </div>

                <!-- 密码 (带有错误状态演示) -->
                <div class="space-y-1">
                    <label class="block text-sm font-medium text-gray-300"><span class="text-errorRed mr-1">*</span>密码</label>
                    <div class="relative">
                        <input type="password" placeholder="请输入您的登录密码" class="w-full bg-inputBg border border-errorRed text-white text-sm rounded-lg px-4 py-3 outline-none transition-colors placeholder-gray-500 pr-10">
                        <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300">
                            <i class="fas fa-eye-slash text-sm"></i>
                        </button>
                    </div>
                    <p class="text-xs text-errorRed mt-1">请输入您的密码</p>
                </div>

                <!-- 推荐码 -->
                <div class="space-y-1">
                    <label class="block text-sm font-medium text-gray-300">推荐码</label>
                    <input type="text" placeholder="请填写推荐码" class="w-full bg-inputBg border border-transparent focus:border-brandYellow text-white text-sm rounded-lg px-4 py-3 outline-none transition-colors placeholder-gray-500">
                    <p class="text-xs text-gray-400 mt-2">无邀请码，请点击此处：<span onclick="openApplyModal()" class="text-brandYellow hover:text-brandYellowHover cursor-pointer font-medium transition-colors">申请账号</span></p>
                </div>

                <!-- 验证码 -->
                <div class="space-y-1">
                    <label class="block text-sm font-medium text-gray-300"><span class="text-errorRed mr-1">*</span>验证码</label>
                    <div class="flex gap-3">
                        <input type="text" placeholder="请输入图片验证码" class="flex-1 bg-inputBg border border-transparent focus:border-brandYellow text-white text-sm rounded-lg px-4 py-3 outline-none transition-colors placeholder-gray-500">
                        <!-- 模拟图形验证码 (与截图高度一致) -->
                        <div class="w-[100px] h-[44px] bg-[#d5a295] rounded-lg overflow-hidden cursor-pointer flex items-center justify-center shrink-0 relative">
                            <span class="text-[#2b358e] font-serif font-bold tracking-widest text-xl transform skew-x-12 opacity-90 z-10">wVXm</span>
                            <!-- 模拟干扰线 -->
                            <div class="absolute w-[120%] h-[2px] bg-[#8e3c2b] rotate-12 top-4 -left-2 z-0"></div>
                            <div class="absolute w-[120%] h-[1px] bg-[#4a559e] rotate-[-15deg] bottom-3 -left-2 z-0"></div>
                        </div>
                    </div>
                </div>

                <!-- 注册按钮 -->
                <button type="button" class="w-full bg-brandYellow hover:bg-brandYellowHover text-gray-900 font-bold py-3.5 rounded-lg transition-colors mt-6 shadow-lg shadow-yellow-500/20">
                    提交注册
                </button>

                <!-- 底部辅助信息 -->
                <div class="flex flex-col gap-3 text-sm mt-4">
                    <div class="text-gray-400">
                        已有账号？ <a href="login.html" class="text-brandYellow hover:text-brandYellowHover font-medium transition-colors">登录</a>
                    </div>
                    
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <div class="relative flex items-center justify-center w-4 h-4 rounded border border-gray-500 bg-transparent group-hover:border-brandYellow transition-colors">
                            <input type="checkbox" class="peer absolute opacity-0 w-full h-full cursor-pointer" checked>
                            <i class="fas fa-check text-[10px] text-brandYellow opacity-0 peer-checked:opacity-100 transition-opacity"></i>
                        </div>
                        <span class="text-gray-400 text-xs">
                            <a href="#" class="text-brandYellow hover:underline">《注册条款》</a>我本人知晓和同意上述所有条款
                        </span>
                    </label>
                </div>
            </form>
        </div>
    </main>

    <!-- 右下角悬浮客服按钮 -->
    <button class="absolute bottom-8 right-8 w-14 h-14 bg-white rounded-full shadow-[0_0_20px_rgba(255,255,255,0.3)] flex items-center justify-center hover:scale-110 transition-transform z-20 group">
        <i class="fas fa-headset text-2xl text-gray-800 group-hover:text-brandYellow transition-colors"></i>
    </button>

    <!-- PRD 文档预览弹窗 -->
    <div id="prdModal" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-center justify-center backdrop-blur-sm transition-opacity duration-300 opacity-0">
        <div class="bg-white w-[90%] h-[90vh] rounded-lg shadow-2xl flex flex-col overflow-hidden transform scale-95 transition-transform duration-300" id="prdModalContent">
            <div class="h-12 bg-gray-100 border-b flex items-center justify-between px-6 shrink-0">
                <div class="flex items-center gap-2 text-indigo-600 font-medium text-sm">
                    <i class="fas fa-file-alt"></i> 注册页面 PRD 文档预览
                </div>
                <button onclick="closePrdModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="flex-1 w-full bg-gray-50 relative">
                <!-- 骨架屏加载动画 -->
                <div id="prdSkeleton" class="absolute inset-0 p-8 z-10 bg-white">
                    <div class="animate-pulse flex space-x-4">
                        <div class="flex-1 space-y-6 py-1">
                            <div class="h-6 bg-gray-200 rounded w-1/4"></div>
                            <div class="space-y-3">
                                <div class="grid grid-cols-3 gap-4">
                                    <div class="h-4 bg-gray-200 rounded col-span-2"></div>
                                    <div class="h-4 bg-gray-200 rounded col-span-1"></div>
                                </div>
                                <div class="h-4 bg-gray-200 rounded"></div>
                                <div class="h-32 bg-gray-100 rounded border border-gray-200"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <iframe id="prdIframe" src="prd-register.html" class="w-full h-full border-0 opacity-0 transition-opacity duration-500" onload="this.style.opacity=1; document.getElementById('prdSkeleton').style.display='none';"></iframe>
            </div>
        </div>
    </div>

    <!-- 试用账户申请弹窗 -->
    <div id="applyModal" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-center justify-center backdrop-blur-sm transition-opacity duration-300 opacity-0 text-gray-800 font-sans">
        <div class="bg-white w-[560px] rounded shadow-2xl flex flex-col overflow-hidden transform scale-95 transition-transform duration-300" id="applyModalContent">
            <!-- Header -->
            <div class="h-12 bg-[#333333] flex items-center justify-between px-4 shrink-0 relative">
                <h3 class="text-white font-medium text-center w-full">留下资料</h3>
                <button onclick="closeApplyModal()" class="text-white hover:text-gray-300 absolute right-4">
                    <i class="fas fa-times text-lg"></i>
                </button>
            </div>
            <!-- Body -->
            <div class="p-8 pb-4">
                <p class="text-sm text-gray-700 mb-6">信息提交后，我们的顾问会在2个工作日内与您联系</p>
                
                <div class="space-y-4">
                    <!-- 姓名 -->
                    <div class="flex border border-gray-300 rounded-sm overflow-hidden">
                        <div class="w-28 bg-gray-50 flex items-center justify-center border-r border-gray-300 text-gray-700 text-sm"><span class="text-red-500 mr-1">*</span>姓名</div>
                        <input type="text" placeholder="请输入" class="flex-1 px-3 py-2 text-sm outline-none focus:bg-gray-50 transition-colors">
                    </div>
                    
                    <!-- 联系电话 -->
                    <div class="flex border border-gray-300 rounded-sm overflow-hidden">
                        <div class="w-28 bg-gray-50 flex items-center justify-center border-r border-gray-300 text-gray-700 text-sm"><span class="text-red-500 mr-1">*</span>联系电话</div>
                        <input type="text" placeholder="请输入" class="flex-1 px-3 py-2 text-sm outline-none focus:bg-gray-50 transition-colors">
                    </div>

                    <!-- 电子邮箱 -->
                    <div class="flex border border-gray-300 rounded-sm overflow-hidden">
                        <div class="w-28 bg-gray-50 flex items-center justify-center border-r border-gray-300 text-gray-700 text-sm"><span class="text-red-500 mr-1">*</span>电子邮箱</div>
                        <input type="email" placeholder="请输入" required class="flex-1 px-3 py-2 text-sm outline-none focus:bg-gray-50 transition-colors">
                    </div>

                    <!-- 信息来源 -->
                    <div class="flex border border-gray-300 rounded-sm overflow-hidden mt-4">
                        <div class="w-28 bg-gray-50 flex items-center justify-center border-r border-gray-300 text-gray-700 text-sm px-2"><span class="text-red-500 mr-1">*</span>信息来源</div>
                        <select required class="flex-1 px-3 py-2 text-sm outline-none cursor-pointer bg-white focus:bg-gray-50 transition-colors text-gray-600">
                            <option value="">请选择</option>
                            <option value="media">媒体</option>
                            <option value="offline">线下</option>
                        </select>
                    </div>

                    <!-- 咨询内容 -->
                    <div class="flex border border-gray-300 rounded-sm overflow-hidden mt-4">
                        <div class="w-28 bg-gray-50 flex items-center justify-center border-r border-gray-300 text-gray-700 text-sm px-2">咨询内容</div>
                        <select class="flex-1 px-3 py-2 text-sm outline-none cursor-pointer bg-white focus:bg-gray-50 transition-colors text-gray-600">
                            <option value="">请选择</option>
                            <option value="1">成为代理</option>
                            <option value="2">政策了解</option>
                            <option value="3">个人交易</option>
                            <option value="4">其他</option>
                        </select>
                    </div>

                    <!-- 微信 -->
                    <div class="flex border border-gray-300 rounded-sm overflow-hidden mt-4">
                        <div class="w-28 bg-gray-50 flex items-center justify-center border-r border-gray-300 text-gray-700 text-sm px-2">微信</div>
                        <input type="text" placeholder="请输入（非必填）" class="flex-1 px-3 py-2 text-sm outline-none focus:bg-gray-50 transition-colors min-w-0">
                    </div>

                    <!-- WhatsApp -->
                    <div class="flex border border-gray-300 rounded-sm overflow-hidden mt-4">
                        <div class="w-28 bg-gray-50 flex items-center justify-center border-r border-gray-300 text-gray-700 text-sm px-2">WhatsApp</div>
                        <input type="text" placeholder="请输入（非必填）" class="flex-1 px-3 py-2 text-sm outline-none focus:bg-gray-50 transition-colors min-w-0">
                    </div>

                    <!-- 其他联系方式 -->
                    <div class="flex border border-gray-300 rounded-sm overflow-hidden mt-4 mb-4">
                        <div class="w-28 bg-gray-50 flex items-center justify-center border-r border-gray-300 text-gray-700 text-sm px-2">其他联系方式</div>
                        <input type="text" placeholder="请输入（非必填）" class="flex-1 px-3 py-2 text-sm outline-none focus:bg-gray-50 transition-colors min-w-0">
                    </div>

                    <!-- 验证码 -->
                    <div class="flex border border-gray-300 rounded-sm overflow-hidden h-10">
                        <div class="w-28 bg-gray-50 flex items-center justify-center border-r border-gray-300 text-gray-700 text-sm shrink-0"><span class="text-red-500 mr-1">*</span>验证码</div>
                        <input type="text" placeholder="请输入" class="flex-1 px-3 py-2 text-sm outline-none focus:bg-gray-50 transition-colors min-w-0">
                        <!-- 图形验证码 -->
                        <div class="w-[120px] bg-[#e6e8fa] border-l border-gray-300 cursor-pointer flex items-center justify-center shrink-0 relative overflow-hidden">
                            <span class="text-[#2b358e] font-serif font-bold tracking-widest text-lg transform skew-x-12 z-10">eXp9</span>
                            <div class="absolute w-[150%] h-[1px] bg-red-400 rotate-12 z-0"></div>
                            <div class="absolute w-[150%] h-[1px] bg-yellow-600 rotate-[-15deg] z-0"></div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Footer -->
            <div class="p-6 pt-2 flex justify-center gap-6">
                <button onclick="closeApplyModal()" class="px-10 py-2 border border-blue-500 text-blue-500 rounded hover:bg-blue-50 transition-colors text-sm bg-white">取消</button>
                <button onclick="submitApply(event)" class="px-10 py-2 bg-[#3b82f6] text-white rounded hover:bg-blue-600 transition-colors text-sm border border-[#3b82f6]">提交</button>
            </div>
        </div>
    </div>

    <!-- 自定义 Alert 弹窗 -->
    <div id="customAlert" class="fixed inset-0 z-[200] hidden flex items-center justify-center transition-opacity duration-300 opacity-0">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeCustomAlert()"></div>
        <div id="customAlertContent" class="bg-white rounded-lg shadow-xl p-6 w-[90%] max-w-[320px] text-center transform scale-95 transition-all duration-300 relative z-10">
            <div class="w-12 h-12 rounded-full bg-green-100 mx-auto flex items-center justify-center mb-4">
                <i class="fa-solid fa-check text-2xl text-green-500"></i>
            </div>
            <p class="text-gray-800 font-medium mb-6">您的资料已提交，请注意邮箱信息</p>
            <button onclick="closeCustomAlert()" class="w-full py-2.5 bg-[#1e40af] hover:bg-blue-800 text-white font-bold rounded transition-colors text-sm shadow-sm">
                确定
            </button>
        </div>
    </div>

    <script>
        // PRD 弹窗逻辑
        const prdModal = document.getElementById('prdModal');
        const prdModalContent = document.getElementById('prdModalContent');
        const prdIframe = document.getElementById('prdIframe');

        function openPrdModal() {
            prdIframe.src = 'prd-register.html?t=' + new Date().getTime();
            prdModal.classList.remove('hidden');
            setTimeout(() => {
                prdModal.classList.remove('opacity-0');
                prdModalContent.classList.remove('scale-95');
                prdModalContent.classList.add('scale-100');
            }, 10);
        }

        function closePrdModal() {
            prdModal.classList.add('opacity-0');
            prdModalContent.classList.remove('scale-100');
            prdModalContent.classList.add('scale-95');
            setTimeout(() => { 
                prdModal.classList.add('hidden');
            }, 300);
        }

        // 试用账户申请弹窗逻辑
        const applyModal = document.getElementById('applyModal');
        const applyModalContent = document.getElementById('applyModalContent');
        const customAlert = document.getElementById('customAlert');
        const customAlertContent = document.getElementById('customAlertContent');

        function openApplyModal() {
            applyModal.classList.remove('hidden');
            setTimeout(() => {
                applyModal.classList.remove('opacity-0');
                applyModalContent.classList.remove('scale-95');
                applyModalContent.classList.add('scale-100');
            }, 10);
        }

        function closeApplyModal() {
            applyModal.classList.add('opacity-0');
            applyModalContent.classList.remove('scale-100');
            applyModalContent.classList.add('scale-95');
            setTimeout(() => { applyModal.classList.add('hidden'); }, 300);
        }

        function closeCustomAlert() {
            customAlert.classList.add('opacity-0');
            customAlertContent.classList.remove('scale-100');
            customAlertContent.classList.add('scale-95');
            setTimeout(() => { customAlert.classList.add('hidden'); }, 300);
        }

        function submitApply(e) {
            e.preventDefault();
            closeApplyModal();
            setTimeout(() => {
                customAlert.classList.remove('hidden');
                setTimeout(() => {
                    customAlert.classList.remove('opacity-0');
                    customAlertContent.classList.remove('scale-95');
                    customAlertContent.classList.add('scale-100');
                }, 10);
            }, 300);
        }
    </script>
</body>
</html>
