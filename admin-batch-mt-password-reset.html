<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HATC CRM - 批量修改MT密码</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        menuBg: '#2A2F3E',
                        menuHover: '#373D4E',
                        menuActive: '#d1a84f',
                        menuText: '#A1A5B7',
                        topBarBg: '#FFFFFF',
                        mainBg: '#F3F4F6',
                        primaryBtn: '#41B8AF',
                        primaryBtnHover: '#359f97',
                        tableHeader: '#41B8AF',
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .submenu-transition { transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out; max-height: 0; opacity: 0; overflow: hidden; }
        .submenu-expanded { max-height: 500px; opacity: 1; }
        .arrow-transition { transition: transform 0.3s ease; }
        .arrow-rotated { transform: rotate(90deg); }
    </style>
</head>
<body class="bg-mainBg font-sans text-gray-800 antialiased h-screen overflow-hidden flex">

    <aside class="w-[240px] bg-menuBg h-full flex flex-col shadow-xl z-20 flex-shrink-0">
        <div class="h-20 flex items-center justify-center border-b border-gray-700/50">
            <span class="text-4xl font-black tracking-wider text-white">HATC</span>
        </div>
        <nav class="flex-1 overflow-y-auto no-scrollbar py-4 px-3 space-y-2">
            <a href="admin-home.html" class="flex items-center px-3 py-3 text-menuText hover:text-white hover:bg-menuHover rounded-lg transition-colors group">
                <i class="fa-solid fa-house w-6 text-center text-lg group-hover:text-white transition-colors"></i><span class="ml-3 font-medium text-[15px]">首页</span>
            </a>
            <div class="menu-group">
                <button onclick="toggleSubmenu(this)" class="w-full flex items-center justify-between px-3 py-3 text-menuText hover:text-white hover:bg-menuHover rounded-lg transition-colors group">
                    <div class="flex items-center">
                        <i class="fa-solid fa-user-group w-6 text-center text-lg group-hover:text-white transition-colors"></i>
                        <span class="ml-3 font-medium text-[15px]">客户管理</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-[10px] arrow-transition"></i>
                </button>
                <div class="submenu-transition pl-11 pr-3 space-y-1 mt-1 submenu-expanded">
                    <a href="admin-client-list.html" class="block py-2 text-sm text-gray-400 hover:text-white transition-colors">客户列表</a>
                    <a href="admin-sales-list.html" class="block py-2 text-sm text-gray-400 hover:text-white transition-colors">销售列表</a>
                    <a href="admin-leads-list.html" class="block py-2 text-sm text-gray-400 hover:text-white transition-colors">留资列表</a>
                    <a href="admin-batch-mt-password-reset.html" class="block py-2 text-sm font-medium text-menuActive transition-colors">批量修改MT密码</a>
                </div>
            </div>
            <a href="../index.html" class="flex items-center px-3 py-3 text-menuText hover:text-white hover:bg-menuHover rounded-lg transition-colors group mt-8 border-t border-gray-700/40 pt-6">
                <i class="fa-solid fa-arrow-left w-6 text-center text-lg group-hover:text-white transition-colors"></i><span class="ml-3 font-medium text-[15px]">返回需求看板</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col min-w-0">
        <header class="h-16 bg-topBarBg shadow-sm flex items-center justify-between px-8 z-10 flex-shrink-0 border-b border-blue-200">
            <div class="flex items-center text-sm text-gray-500">
                <span class="hover:text-gray-800 cursor-pointer">客户管理</span>
                <i class="fa-solid fa-chevron-right text-[10px] mx-3 text-gray-300"></i>
                <span class="text-menuActive font-medium mr-6">批量修改MT密码</span>
                <a href="../index.html" class="flex items-center gap-1.5 bg-gray-50 hover:bg-gray-100 text-gray-600 px-3 py-1.5 rounded transition-colors border border-gray-200 text-xs font-medium ml-4">
                    <i class="fas fa-arrow-left"></i> 返回需求看板
                </a>
            </div>
            <div class="flex items-center gap-4">
                <div class="w-8 h-8 rounded-full bg-gray-200 text-white flex items-center justify-center overflow-hidden border border-gray-200 shadow-sm">
                    <span class="text-sm font-bold text-gray-600">SM</span>
                </div>
                <span class="text-sm text-gray-700 font-medium">史密斯</span>
            </div>
        </header>

        <div class="flex-1 p-6 overflow-y-auto">

            <div class="max-w-5xl mx-auto">
                <div class="flex items-center gap-2 mb-6">
                    <i class="fas fa-key text-[#d1a84f] text-xl"></i>
                    <h2 class="text-xl font-bold text-gray-800">批量修改 MT 密码</h2>
                    <span class="text-xs text-gray-400 ml-2">按分组批量重置交易密码 / 只读（投资人）密码</span>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">

                    <div class="p-6 border-b border-gray-100">
                        <div class="grid grid-cols-2 gap-6">

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">
                                    <span class="text-red-500 mr-1">*</span>选择分组
                                </label>
                                <select id="groupSelect" onchange="previewAccounts()" class="w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm outline-none focus:border-primaryBtn focus:ring-1 focus:ring-primaryBtn text-gray-600 bg-white">
                                    <option value="">-- 请选择 MT 服务器分组 --</option>
                                    <option value="group1" selected>MT5-Live-01（真实盘 #1）</option>
                                    <option value="group2">MT5-Live-02（真实盘 #2）</option>
                                    <option value="group3">MT5-Demo（模拟盘）</option>
                                    <option value="group4">MT4-Live（旧版真实盘）</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">
                                    <span class="text-red-500 mr-1">*</span>密码类型
                                </label>
                                <div class="grid grid-cols-2 gap-3 h-[42px] items-center">
                                    <label class="flex items-center gap-2 cursor-pointer p-2.5 rounded-md border border-gray-200 hover:border-primaryBtn hover:bg-teal-50 transition-colors has-[:checked]:border-primaryBtn has-[:checked]:bg-teal-50">
                                        <input type="radio" name="pwdType" value="trade" class="w-4 h-4 text-teal-600 focus:ring-teal-500" checked>
                                        <div>
                                            <span class="text-sm font-medium text-gray-800">交易密码</span>
                                            <p class="text-[11px] text-gray-400">主密码，可登录交易</p>
                                        </div>
                                    </label>
                                    <label class="flex items-center gap-2 cursor-pointer p-2.5 rounded-md border border-gray-200 hover:border-primaryBtn hover:bg-teal-50 transition-colors has-[:checked]:border-primaryBtn has-[:checked]:bg-teal-50">
                                        <input type="radio" name="pwdType" value="investor" class="w-4 h-4 text-teal-600 focus:ring-teal-500">
                                        <div>
                                            <span class="text-sm font-medium text-gray-800">只读密码</span>
                                            <p class="text-[11px] text-gray-400">投资人密码，仅查看</p>
                                        </div>
                                    </label>
                                </div>
                            </div>

                        </div>
                    </div>

                    <div class="p-6 border-b border-gray-100 bg-gray-50/50">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                <span class="text-red-500 mr-1">*</span>统一密码（所有账号共用一个）
                            </label>
                            <div class="flex gap-2">
                                <input type="text" id="unifiedPwd" placeholder="点击右侧按钮自动生成，或手动输入" class="flex-1 border border-gray-300 rounded-md px-3 py-2.5 text-sm outline-none focus:border-primaryBtn focus:ring-1 focus:ring-primaryBtn font-mono tracking-wider">
                                <button type="button" onclick="autoGenPwd()" class="px-4 py-2.5 border border-gray-300 bg-white text-gray-600 hover:bg-gray-50 rounded-md text-sm transition-colors flex items-center gap-1.5">
                                    <i class="fas fa-magic text-xs"></i> 自动生成
                                </button>
                                <button type="button" onclick="copyPwd()" class="px-4 py-2.5 border border-gray-300 bg-white text-gray-600 hover:bg-gray-50 rounded-md text-sm transition-colors flex items-center gap-1.5">
                                    <i class="far fa-copy text-xs"></i> 复制
                                </button>
                                <button type="button" onclick="togglePwdVisible()" class="px-4 py-2.5 border border-gray-300 bg-white text-gray-600 hover:bg-gray-50 rounded-md text-sm transition-colors flex items-center gap-1.5">
                                    <i id="pwdEye" class="fas fa-eye text-xs"></i>
                                    <span id="pwdEyeLabel">隐藏</span>
                                </button>
                            </div>
                            <p class="mt-2 text-xs text-gray-400">密码规则：8-16 位，必须包含大写字母、小写字母、数字</p>
                        </div>
                    </div>

                    <div class="p-6">
                        <div class="flex items-center justify-between mb-3">
                            <div class="text-sm font-medium text-gray-700">
                                待处理账号预览
                                <span class="ml-2 text-xs text-gray-400 font-normal" id="accountCount">共 0 个账号</span>
                            </div>
                            <span class="text-xs text-gray-400">按「选择分组」联动加载</span>
                        </div>
                        <div class="border border-gray-200 rounded-md overflow-hidden">
                            <table class="w-full text-sm">
                                <thead class="bg-tableHeader text-white">
                                    <tr>
                                        <th class="w-10 py-2.5 text-center"><input type="checkbox" class="w-4 h-4" checked onclick="toggleAllAcc(this)"></th>
                                        <th class="py-2.5 px-3 text-left w-32">MT 账号</th>
                                        <th class="py-2.5 px-3 text-left">客户姓名</th>
                                        <th class="py-2.5 px-3 text-left w-32">账户类型</th>
                                        <th class="py-2.5 px-3 text-left w-40">归属销售</th>
                                        <th class="py-2.5 px-3 text-left w-28">净值（USD）</th>
                                    </tr>
                                </thead>
                                <tbody id="accountTbody" class="divide-y divide-gray-100 text-gray-700">
                                    <tr><td colspan="6" class="py-10 text-center text-gray-400 text-sm">请先在上方选择分组</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="p-5 border-t border-gray-100 bg-gray-50 rounded-b-xl flex justify-center gap-4">
                        <button onclick="history.back()" class="px-8 py-2 border border-gray-300 text-gray-600 rounded-md hover:bg-white transition-colors text-sm bg-gray-50">
                            取消
                        </button>
                        <button onclick="confirmReset()" class="px-8 py-2 bg-primaryBtn text-white rounded-md hover:bg-primaryBtnHover transition-colors text-sm shadow-sm">
                            <i class="fas fa-check mr-1.5"></i>确认批量修改
                        </button>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <!-- 结果弹窗 -->
    <div id="resultModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center">
        <div class="bg-white w-[480px] rounded-lg shadow-2xl overflow-hidden">
            <div class="bg-green-500 text-white px-5 py-3 flex items-center justify-between">
                <span class="font-medium"><i class="fas fa-check-circle mr-1.5"></i>批量修改完成</span>
                <button onclick="closeResult()" class="hover:bg-white/20 rounded px-1.5 py-0.5"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-5">
                <div class="grid grid-cols-3 gap-3 mb-4">
                    <div class="bg-gray-50 rounded p-3 text-center">
                        <p class="text-xs text-gray-500">总数</p>
                        <p class="text-xl font-bold text-gray-800 mt-1" id="resTotal">0</p>
                    </div>
                    <div class="bg-green-50 rounded p-3 text-center">
                        <p class="text-xs text-green-600">成功</p>
                        <p class="text-xl font-bold text-green-600 mt-1" id="resSuccess">0</p>
                    </div>
                    <div class="bg-red-50 rounded p-3 text-center">
                        <p class="text-xs text-red-500">失败</p>
                        <p class="text-xl font-bold text-red-500 mt-1">0</p>
                    </div>
                </div>
                <p class="text-xs text-gray-500 mb-3"><i class="fas fa-file-csv mr-1"></i>对照表已自动生成，请及时下载：</p>
                <button class="w-full py-2 bg-teal-50 hover:bg-teal-100 text-teal-700 border border-teal-200 rounded text-sm font-medium transition-colors">
                    <i class="fas fa-download mr-1.5"></i>下载 MT5-Live-01_密码重置结果_20260818.csv
                </button>
            </div>
        </div>
    </div>

    <script>
        function toggleSubmenu(btn) {
            const box = btn.nextElementSibling;
            box.classList.toggle('submenu-expanded');
            btn.querySelector('.arrow-transition')?.classList.toggle('arrow-rotated');
        }

        const mockData = {
            group1: [
                ['100001', '张三', '标准账户', '李四', '12,450.00'],
                ['100002', '王五', 'ECN账户', '王刚', '3,200.00'],
                ['100003', '陈老板', '标准账户', '李四', '58,900.00'],
                ['100004', '赵六', '美分账户', '赵敏', '450.50'],
                ['100005', '孙七', '标准账户', '王刚', '9,100.00'],
                ['100006', '周八', 'ECN账户', '赵敏', '24,600.00'],
            ],
            group2: [
                ['200001', '客户A', '标准账户', '销售A', '1,100.00'],
                ['200002', '客户B', 'ECN账户', '销售B', '7,800.00'],
            ],
            group3: [
                ['300001', 'Demo-01', '模拟账户', '-', '50,000.00'],
                ['300002', 'Demo-02', '模拟账户', '-', '100,000.00'],
            ],
            group4: [
                ['900001', '老客户X', 'MT4 标准', '李四', '2,300.00'],
            ]
        };

        function previewAccounts() {
            const val = document.getElementById('groupSelect').value;
            const tbody = document.getElementById('accountTbody');
            const count = document.getElementById('accountCount');
            if (!val) {
                tbody.innerHTML = '<tr><td colspan="6" class="py-10 text-center text-gray-400 text-sm">请先在上方选择分组</td></tr>';
                count.textContent = '共 0 个账号';
                return;
            }
            const rows = mockData[val] || [];
            count.textContent = `共 ${rows.length} 个账号`;
            tbody.innerHTML = rows.map(r => `
                <tr class="hover:bg-gray-50">
                    <td class="text-center py-2.5"><input type="checkbox" class="w-4 h-4 acc-cb" checked></td>
                    <td class="py-2.5 px-3 font-mono text-gray-800">${r[0]}</td>
                    <td class="py-2.5 px-3">${r[1]}</td>
                    <td class="py-2.5 px-3">${r[2]}</td>
                    <td class="py-2.5 px-3">${r[3]}</td>
                    <td class="py-2.5 px-3 text-right font-medium">${r[4]}</td>
                </tr>
            `).join('');
        }

        function toggleAllAcc(source) {
            document.querySelectorAll('.acc-cb').forEach(cb => cb.checked = source.checked);
        }

        function toggleGenType() {
            const val = document.querySelector('input[name="genType"]:checked').value;
            document.getElementById('manualPwdBox').classList.toggle('hidden', val !== 'manual');
        }

        function confirmReset() {
            const group = document.getElementById('groupSelect').value;
            if (!group) { alert('请先选择分组'); return; }
            const pwd = document.getElementById('unifiedPwd').value.trim();
            if (!pwd) { alert('请先设置统一密码（自动生成或手动输入）'); document.getElementById('unifiedPwd').focus(); return; }
            const n = (mockData[group] || []).length;
            document.getElementById('resTotal').textContent = n;
            document.getElementById('resSuccess').textContent = n;
            const m = document.getElementById('resultModal');
            m.classList.remove('hidden');
            m.classList.add('flex');
        }
        function closeResult() {
            const m = document.getElementById('resultModal');
            m.classList.add('hidden');
            m.classList.remove('flex');
        }

        function autoGenPwd() {
            const upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
            const lower = 'abcdefghijkmnpqrstuvwxyz';
            const num = '23456789';
            const all = upper + lower + num;
            let s = upper[Math.floor(Math.random()*upper.length)]
                + lower[Math.floor(Math.random()*lower.length)]
                + num[Math.floor(Math.random()*num.length)];
            for (let i = 0; i < 9; i++) s += all[Math.floor(Math.random()*all.length)];
            s = s.split('').sort(() => Math.random() - 0.5).join('');
            document.getElementById('unifiedPwd').value = s;
        }
        function copyPwd() {
            const v = document.getElementById('unifiedPwd').value;
            if (!v) return;
            navigator.clipboard.writeText(v);
            const btn = event.currentTarget;
            const html = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check text-green-500 text-xs"></i> 已复制';
            setTimeout(() => btn.innerHTML = html, 1200);
        }
        let pwdVisible = true;
        function togglePwdVisible() {
            const el = document.getElementById('unifiedPwd');
            const eye = document.getElementById('pwdEye');
            const lbl = document.getElementById('pwdEyeLabel');
            pwdVisible = !pwdVisible;
            el.type = pwdVisible ? 'text' : 'password';
            eye.className = pwdVisible ? 'fas fa-eye text-xs' : 'fas fa-eye-slash text-xs';
            lbl.textContent = pwdVisible ? '隐藏' : '显示';
        }

        previewAccounts();
        autoGenPwd();
    </script>
</body>
</html>
