<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 HATC - CRM-HK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #eef2f6 0%, #ffffff 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        /* Background pattern to mimic the screenshot */
        .bg-pattern {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 100px 100px;
            transform: perspective(500px) rotateX(60deg) scale(2);
            transform-origin: center top;
            z-index: -1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-hidden">
    <div class="bg-pattern"></div>
    
    <!-- Header -->
    <header class="w-full px-8 py-4 flex justify-between items-center z-10 relative">
        <div class="flex items-center gap-2">
            <!-- Logo -->
            <div class="text-2xl font-black text-[#1e3a8a] tracking-wider">HATC</div>
        </div>
        <div class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer bg-white px-3 py-1.5 rounded border border-gray-200 shadow-sm">
            <img src="https://flagcdn.com/w20/cn.png" alt="CN" class="w-5 h-auto rounded-sm">
            <span>简体中文</span>
            <i class="fa-solid fa-chevron-down text-xs ml-1"></i>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center w-full max-w-6xl mx-auto px-4 z-10 relative">
        <div class="w-full flex flex-col md:flex-row items-center justify-between gap-12 lg:gap-24">
            
            <!-- Left Illustration Placeholder -->
            <div class="hidden md:flex flex-1 justify-center relative">
                <!-- A stylized representation of the 3D asset in the screenshot -->
                <div class="relative w-full max-w-md h-[400px] flex items-center justify-center">
                    <div class="absolute inset-0 bg-gradient-to-tr from-[#1e3a8a]/10 to-transparent rounded-full blur-3xl"></div>
                    <div class="relative z-10 w-64 h-80 bg-gradient-to-br from-[#d4af37] to-[#fcd574] rounded-lg shadow-2xl transform -rotate-6 flex items-center justify-center border-4 border-white/50">
                        <div class="w-48 h-64 bg-white/90 backdrop-blur rounded shadow-inner p-4 flex flex-col gap-3 transform rotate-6 translate-x-8 -translate-y-4">
                            <div class="w-12 h-12 rounded-full bg-gray-200 flex items-center justify-center text-gray-400 mb-2"><i class="fa-solid fa-user text-xl"></i></div>
                            <div class="h-3 w-full bg-gray-200 rounded"></div>
                            <div class="h-3 w-3/4 bg-gray-200 rounded"></div>
                            <div class="h-3 w-5/6 bg-gray-200 rounded"></div>
                            <div class="mt-auto h-8 w-full bg-[#fcd574]/30 rounded border border-[#fcd574]/50"></div>
                        </div>
                    </div>
                    <div class="absolute bottom-10 left-10 w-20 h-20 bg-white rounded-xl shadow-xl flex items-center justify-center z-20">
                        <i class="fa-solid fa-chart-simple text-3xl text-[#d4af37]"></i>
                    </div>
                </div>
            </div>

            <!-- Right Form Card -->
            <div class="w-full max-w-[420px]">
                <div class="bg-white rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] p-8 sm:p-10 border border-gray-100">
                    <h2 class="text-2xl font-bold text-gray-900 mb-8">登录 HATC</h2>
                    
                    <form action="admin-home.html" method="GET" class="space-y-5">
                        <!-- Email -->
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">邮箱</label>
                            <input type="email" placeholder="请输入邮箱" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-[#fcd574] focus:ring-2 focus:ring-[#fcd574]/20 transition-colors text-sm" required>
                        </div>
                        
                        <!-- Password -->
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">密码</label>
                            <div class="relative">
                                <input type="password" placeholder="请输入登录密码" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-[#fcd574] focus:ring-2 focus:ring-[#fcd574]/20 transition-colors text-sm" required>
                                <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                                    <i class="fa-regular fa-eye-slash"></i>
                                </button>
                            </div>
                        </div>
                        
                        <!-- Captcha -->
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">验证码</label>
                            <div class="flex gap-3">
                                <input type="text" placeholder="请输入验证码" class="flex-1 px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-[#fcd574] focus:ring-2 focus:ring-[#fcd574]/20 transition-colors text-sm" required>
                                <div class="w-28 h-12 bg-gray-100 rounded-lg overflow-hidden relative cursor-pointer flex-shrink-0 border border-gray-200">
                                    <!-- Fake Captcha Image -->
                                    <div class="absolute inset-0 bg-[#e5e7eb] opacity-50 flex items-center justify-center">
                                        <svg width="100%" height="100%">
                                            <line x1="0" y1="10" x2="100" y2="40" stroke="#fca5a5" stroke-width="1.5"/>
                                            <line x1="0" y1="40" x2="100" y2="10" stroke="#93c5fd" stroke-width="1"/>
                                            <circle cx="20" cy="20" r="2" fill="#6b7280"/>
                                            <circle cx="80" cy="30" r="1.5" fill="#6b7280"/>
                                        </svg>
                                    </div>
                                    <div class="absolute inset-0 flex items-center justify-center font-serif text-xl font-bold tracking-widest text-red-800 mix-blend-multiply select-none">
                                        1 4 5 4
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Submit Button -->
                        <div class="pt-2">
                            <button type="button" onclick="handleLogin()" class="w-full py-3.5 bg-[#fcd574] hover:bg-[#fbc543] text-gray-900 font-bold rounded-lg transition-colors shadow-sm text-sm">
                                登录
                            </button>
                        </div>
                        
                        <!-- Footer Links -->
                        <div class="flex items-center justify-between mt-6 text-sm">
                            <div>
                                <span class="text-gray-500">没有账号？</span>
                                <a href="account-registration.html" class="text-[#d4af37] hover:text-[#b8952b] font-medium transition-colors">去注册</a>
                            </div>
                            <a href="#" class="text-gray-500 hover:text-gray-800 transition-colors">忘记密码</a>
                        </div>
                        
                        <!-- 进度查询辅助入口 -->
                        <div class="text-center mt-6 pt-4 border-t border-gray-100">
                            <a href="check-status.html" class="text-xs text-gray-400 hover:text-gray-600 transition-colors"><i class="fa-solid fa-magnifying-glass mr-1"></i>开户审核进度查询</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Floating CS Icon -->
    <div class="fixed bottom-8 right-8 z-50">
        <div class="w-12 h-12 bg-white rounded-full shadow-lg flex items-center justify-center text-gray-700 cursor-pointer hover:scale-110 transition-transform border border-gray-100">
            <i class="fa-solid fa-headset text-xl"></i>
        </div>
    </div>

    <script>
        function handleLogin() {
            // 获取 URL 参数中的 redirect 字段
            const urlParams = new URLSearchParams(window.location.search);
            const redirectUrl = urlParams.get('redirect');
            
            // 简单的模拟登录动画
            const btn = document.querySelector('button[onclick="handleLogin()"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 登录中...';
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            setTimeout(() => {
                // 如果有 redirect 参数，则跳转到指定页面，否则默认跳转到 admin-home.html
                if (redirectUrl) {
                    window.location.href = redirectUrl;
                } else {
                    window.location.href = 'admin-home.html';
                }
            }, 800);
        }
    </script>
</body>
</html>
