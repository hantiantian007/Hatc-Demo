<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HATC - 官方网站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1D64D8', /* 匹配截图中的深蓝色 */
                        dark: '#111827',
                    }
                }
            }
        }
    </script>
    <style>
        .bg-hero-pattern {
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="font-sans antialiased bg-white text-gray-800">

    <!-- 顶部联系信息栏 -->
    <div class="border-b border-gray-100 py-2">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-end items-center text-xs text-gray-500 gap-6">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-phone"></i>
                <span>(852) 2322 2888</span>
            </div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-envelope"></i>
                <span>info@hatchk.com</span>
            </div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-tag"></i>
                <span>香港黄金交易员编号008 AA类</span>
            </div>
            <div class="flex items-center gap-1 bg-blue-50 text-primary px-2 py-1 rounded">
                <i class="fa-solid fa-bullhorn"></i>
                <span>最新公告</span>
            </div>
        </div>
    </div>

    <!-- 主导航栏 -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center">
                    <span class="text-3xl font-black tracking-tighter text-[#1e3a8a]">HATC</span>
                </div>

                <!-- 导航菜单 -->
                <nav class="hidden md:flex space-x-8">
                </nav>

                <!-- 右侧操作区 -->
                <div class="flex items-center gap-6">
                    <div class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
                        <img src="https://flagcdn.com/w20/cn.png" alt="CN" class="w-5 h-auto">
                        <span>中文简体</span>
                    </div>
                    
                    <!-- 按钮组 -->
                    <div class="flex items-center gap-3">
                        <!-- 注册登录按钮，点击跳转至登录页面 -->
                        <a href="login.html" class="bg-primary hover:bg-blue-700 text-white px-6 py-2.5 rounded font-medium text-sm transition-colors shadow-md">
                            登录 / 注册
                    </div>
                    
                    <button class="md:hidden text-gray-600">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Hero 区域 -->
    <main class="relative bg-hero-pattern overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-20 pb-32">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
                
                <!-- 左侧文字 -->
                <div>
                    <h1 class="text-5xl md:text-6xl font-bold text-gray-900 leading-tight mb-8">
                        天时地利，<br>恒星闪耀
                    </h1>
                    
                    <div class="flex items-center gap-4 mb-12">
                        <div class="flex -space-x-3">
                            <div class="w-10 h-10 rounded-full bg-gray-300 border-2 border-white flex items-center justify-center overflow-hidden"><img src="https://i.pravatar.cc/100?img=11" alt="user"></div>
                            <div class="w-10 h-10 rounded-full bg-gray-300 border-2 border-white flex items-center justify-center overflow-hidden"><img src="https://i.pravatar.cc/100?img=12" alt="user"></div>
                            <div class="w-10 h-10 rounded-full bg-gray-300 border-2 border-white flex items-center justify-center overflow-hidden"><img src="https://i.pravatar.cc/100?img=13" alt="user"></div>
                            <div class="w-10 h-10 rounded-full bg-gray-300 border-2 border-white flex items-center justify-center overflow-hidden"><img src="https://i.pravatar.cc/100?img=14" alt="user"></div>
                        </div>
                        <div>
                            <p class="font-bold text-lg text-gray-900">3,000+</p>
                            <p class="text-sm text-gray-500">信赖客户</p>
                        </div>
                    </div>

                    <a href="#" class="inline-flex items-center gap-2 bg-primary hover:bg-blue-700 text-white px-8 py-3.5 rounded font-medium transition-colors shadow-lg shadow-blue-500/30">
                        咨询客服 <i class="fa-solid fa-arrow-right"></i>
                </div>

                <!-- 右侧图片与图表 -->
                <div class="relative">
                    <div class="absolute inset-0 bg-gradient-to-r from-white via-transparent to-transparent z-10"></div>
                    <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop" alt="Cityscape with chart overlay" class="rounded-lg shadow-2xl object-cover h-[500px] w-full mix-blend-multiply opacity-90">
                    
                    <!-- 浮动数据卡片 -->
                    <div class="absolute -bottom-10 -right-10 bg-white p-6 rounded-lg shadow-xl z-20 flex items-center gap-6 border border-gray-100">
                        <div class="text-primary text-4xl">
                            <i class="fa-solid fa-chart-simple"></i>
                        </div>
                        <div>
                            <p class="text-3xl font-bold text-gray-900 mb-1">10,000+</p>
                            <p class="text-sm text-gray-500">交易者信任的平台</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
